services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: message-agent-napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      ACCOUNT: "${NAPCAT_ACCOUNT:-}"
      WEBUI_TOKEN: "${WEBUI_TOKEN:-napcat}"
      TZ: Asia/Shanghai
    ports:
      # WebUI 仅允许本机访问，避免管理页直接暴露到局域网/公网。
      - "127.0.0.1:6099:6099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
